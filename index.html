<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOS Files & Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --primary-red: #ff1a1a; --dark-red: #8b0000; --text-color: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.2) 0%, transparent 60%), linear-gradient(0deg, #000 0%, #0a0a0a 100%);
            color: var(--text-color); font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 26, 26, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 26, 26, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1; animation: moveGrid 15s linear infinite;
        }
        @keyframes moveGrid { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } }
        .logo-container { position: relative; margin-bottom: 40px; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
        .logo-ring { position: absolute; border-radius: 50%; border: 2px solid transparent; animation: pulseRing 3s infinite ease-in-out; }
        .ring-1 { width: 100%; height: 100%; border-top-color: var(--primary-red); border-bottom-color: var(--primary-red); animation-duration: 4s; }
        .ring-2 { width: 115%; height: 115%; border-left-color: var(--dark-red); border-right-color: var(--dark-red); animation-duration: 6s; animation-direction: reverse; }
        .ring-3 { width: 130%; height: 130%; border-top-color: rgba(255, 26, 26, 0.3); border-bottom-color: rgba(255, 26, 26, 0.3); animation-duration: 8s; }
        @keyframes pulseRing {
            0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.05); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
        }
        .logo-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-red);
            box-shadow: 0 0 30px var(--primary-red), inset 0 0 20px rgba(0,0,0,0.8);
            animation: logoPulse 3s infinite ease-in-out; z-index: 2; position: relative;
        }
        @keyframes logoPulse {
            0% { box-shadow: 0 0 20px var(--primary-red), inset 0 0 20px rgba(0,0,0,0.8); }
            50% { box-shadow: 0 0 60px var(--primary-red), inset 0 0 20px rgba(0,0,0,0.8); }
            100% { box-shadow: 0 0 20px var(--primary-red), inset 0 0 20px rgba(0,0,0,0.8); }
        }
        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: white;
            text-shadow: 0 0 10px var(--primary-red), 0 0 20px var(--primary-red);
            margin-bottom: 10px; letter-spacing: 2px; animation: flicker 4s infinite alternate;
        }
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; text-shadow: 0 0 10px var(--primary-red), 0 0 20px var(--primary-red); }
            20%, 24%, 55% { opacity: 0.5; text-shadow: none; }
        }
        p.subtitle { color: #888; font-size: 1.1rem; margin-bottom: 30px; letter-spacing: 1px; }
        .search-box {
            background: rgba(10, 10, 10, 0.9); border: 1px solid var(--dark-red);
            padding: 30px; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 26, 26, 0.2);
            width: 100%; max-width: 400px; backdrop-filter: blur(5px); z-index: 10;
        }
        input[type="text"] {
            width: 100%; padding: 15px; background: #000; border: 1px solid #333;
            color: var(--primary-red); font-family: 'Orbitron', sans-serif; font-size: 1.2rem;
            text-align: center; letter-spacing: 5px; border-radius: 5px; margin-bottom: 20px;
            outline: none; transition: all 0.3s ease;
        }
        input[type="text"]:focus { border-color: var(--primary-red); box-shadow: 0 0 20px rgba(255, 26, 26, 0.5); }
        button {
            width: 100%; padding: 15px; background: var(--dark-red); color: white;
            border: none; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; border-radius: 5px; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: var(--primary-red); box-shadow: 0 0 25px var(--primary-red); transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box {
            margin-top: 25px; padding: 20px; border: 1px solid #333; border-radius: 5px;
            display: none; background: #111; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-box.success { border-color: #00ff00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); }
        .result-box.error { border-color: var(--primary-red); box-shadow: 0 0 20px rgba(255, 26, 26, 0.3); }
        .file-name { font-family: 'Orbitron', sans-serif; color: white; margin-bottom: 15px; font-size: 1.2rem; word-break: break-all; }
        .download-btn {
            display: inline-block; padding: 10px 20px; background: transparent;
            border: 1px solid var(--primary-red); color: var(--primary-red); text-decoration: none;
            font-family: 'Orbitron', sans-serif; border-radius: 5px; transition: all 0.3s ease; cursor: pointer;
        }
        .download-btn:hover { background: var(--primary-red); color: white; box-shadow: 0 0 15px var(--primary-red); }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-ring ring-1"></div>
        <div class="logo-ring ring-2"></div>
        <div class="logo-ring ring-3"></div>
        <img src="logo.png" alt="Logo" class="logo-img">
    </div>
    <h1>BIOS FILES & SOLUTIONS</h1>
    <p class="subtitle">Enter your access code to unlock your file</p>
    <div class="search-box">
        <input type="text" id="codeInput" placeholder="XXXXXX" maxlength="6" autocomplete="off">
        <button onclick="checkCode()" id="submitBtn">Unlock File</button>
        <div class="result-box" id="resultBox">
            <div class="file-name" id="fileNameDisplay"></div>
            <a href="#" class="download-btn" id="downloadBtn" target="_blank">Download</a>
        </div>
    </div>
    <script>
        async function checkCode() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const resultBox = document.getElementById('resultBox');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const downloadBtn = document.getElementById('downloadBtn');
            const submitBtn = document.getElementById('submitBtn');

            if (!code) {
                resultBox.className = 'result-box error';
                resultBox.style.display = 'block';
                fileNameDisplay.innerText = 'Please enter a code.';
                downloadBtn.style.display = 'none';
                return;
            }

            submitBtn.innerText = 'Checking...';
            submitBtn.disabled = true;
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`/api/check-code?code=${code}`);
                const data = await response.json();

                if (response.ok && data.success) {
                    resultBox.className = 'result-box success';
                    resultBox.style.display = 'block';
                    fileNameDisplay.innerText = `File Found: ${data.fileName}`;
                    if (data.downloadUrl) {
                        downloadBtn.href = data.downloadUrl;
                        downloadBtn.style.display = 'inline-block';
                    } else {
                        downloadBtn.style.display = 'none';
                    }
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.style.display = 'block';
                    fileNameDisplay.innerText = 'Invalid or expired code.';
                    downloadBtn.style.display = 'none';
                }
            } catch (error) {
                resultBox.className = 'result-box error';
                resultBox.style.display = 'block';
                fileNameDisplay.innerText = 'Network error. Try again.';
                downloadBtn.style.display = 'none';
            } finally {
                submitBtn.innerText = 'Unlock File';
                submitBtn.disabled = false;
            }
        }
        document.getElementById('codeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
