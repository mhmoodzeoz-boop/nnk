<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouble Makers - BIOS Files</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --primary-red: #ff1a1a; --dark-red: #8b0000; --text-color: #e0e0e0; --card-bg: rgba(15, 15, 15, 0.85); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); color: var(--text-color); font-family: 'Rajdhani', sans-serif;
            min-height: 100vh; overflow-x: hidden; position: relative;
        }
        /* Particles Background */
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; background: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.15) 0%, transparent 70%); }

        /* Loading Animation */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease;
        }
        .loader-logo { width: 100px; height: 100px; border: 3px solid var(--primary-red); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-family: 'Orbitron', sans-serif; color: var(--primary-red); letter-spacing: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

        /* Header */
        header { display: flex; flex-direction: column; align-items: center; padding: 40px 20px 20px; text-align: center; position: relative; }
        .logo-container { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .logo-ring { position: absolute; border-radius: 50%; border: 2px solid transparent; animation: pulseRing 3s infinite ease-in-out; }
        .ring-1 { width: 100%; height: 100%; border-top-color: var(--primary-red); border-bottom-color: var(--primary-red); animation-duration: 4s; }
        .ring-2 { width: 115%; height: 115%; border-left-color: var(--dark-red); border-right-color: var(--dark-red); animation-duration: 6s; animation-direction: reverse; }
        @keyframes pulseRing { 0% { transform: rotate(0deg) scale(1); opacity: 0.5; } 50% { transform: rotate(180deg) scale(1.05); opacity: 1; } 100% { transform: rotate(360deg) scale(1); opacity: 0.5; } }
        .logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-red); box-shadow: 0 0 20px var(--primary-red); animation: logoPulse 3s infinite ease-in-out; z-index: 2; position: relative; }
        @keyframes logoPulse { 0% { box-shadow: 0 0 20px var(--primary-red); } 50% { box-shadow: 0 0 40px var(--primary-red); } 100% { box-shadow: 0 0 20px var(--primary-red); } }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: white; text-shadow: 0 0 10px var(--primary-red); letter-spacing: 2px; animation: flicker 4s infinite alternate; }
        @keyframes flicker { 0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: 0.5; } }
        p.subtitle { color: #888; font-size: 1rem; margin-top: 10px; letter-spacing: 1px; }

        /* Filters */
        .filters-container { max-width: 1200px; margin: 20px auto 0; padding: 0 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .filters-container input, .filters-container select {
            padding: 12px 20px; background: rgba(0,0,0,0.8); border: 1px solid #333; color: white;
            border-radius: 5px; font-family: 'Rajdhani', sans-serif; font-size: 1rem; outline: none;
        }
        .filters-container input:focus, .filters-container select:focus { border-color: var(--primary-red); }
        .filters-container input { flex: 1; max-width: 400px; }
        .filters-container select { max-width: 200px; cursor: pointer; }

        /* Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .product-card {
            background: var(--card-bg); border: 1px solid #222; border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            transition: all 0.4s ease; backdrop-filter: blur(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .product-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
            transform: scaleX(0); transition: transform 0.4s ease; transform-origin: center;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--dark-red); box-shadow: 0 10px 30px rgba(255, 26, 26, 0.15); }
        .product-card:hover::before { transform: scaleX(1); }
        
        /* Status Badge */
        .status-badge {
            position: absolute; top: 15px; right: 15px; padding: 4px 10px; border-radius: 4px;
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px;
        }
        .status-available { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
        .status-sold { background: rgba(255, 0, 0, 0.1); color: #ff0000; border: 1px solid #ff0000; }

        .product-name { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: white; margin-bottom: 10px; padding-right: 60px; }
        .product-desc { font-size: 0.95rem; color: #aaa; margin-bottom: 20px; flex-grow: 1; line-height: 1.4; }
        
        .code-section { margin-top: auto; border-top: 1px solid #222; padding-top: 15px; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 10px; background: #000; border: 1px solid #333; color: var(--primary-red);
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; border-radius: 5px; outline: none; text-align: center;
        }
        input[type="text"]:focus { border-color: var(--primary-red); }
        button {
            padding: 10px 15px; background: var(--dark-red); color: white; border: none;
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            border-radius: 5px; transition: all 0.3s ease; white-space: nowrap;
        }
        button:hover { background: var(--primary-red); box-shadow: 0 0 15px var(--primary-red); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .download-btn {
            display: none; width: 100%; margin-top: 10px; text-align: center; padding: 12px;
            background: transparent; border: 1px solid var(--primary-red); color: var(--primary-red);
            text-decoration: none; font-family: 'Orbitron', sans-serif; border-radius: 5px; transition: all 0.3s ease;
        }
        .download-btn:hover { background: var(--primary-red); color: white; box-shadow: 0 0 15px var(--primary-red); }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #111; color: white;
            padding: 15px 25px; border-left: 4px solid var(--primary-red); border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); transform: translateX(150%); transition: transform 0.4s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #ff0000; }
        .toast.success { border-left-color: #00ff00; }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-logo"></div>
        <div class="loader-text">TROUBLE MAKERS</div>
    </div>

    <!-- Particles -->
    <div id="particles-js"></div>

    <header>
        <div class="logo-container">
            <div class="logo-ring ring-1"></div>
            <div class="logo-ring ring-2"></div>
            <img src="logo.png" alt="Logo" class="logo-img">
        </div>
        <h1>TROUBLE MAKERS</h1>
        <p class="subtitle">Premium BIOS Files & Tools</p>
    </header>

    <!-- Filters -->
    <div class="filters-container">
        <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="filterProducts()">
        <select id="categoryFilter" onchange="filterProducts()">
            <option value="all">All Categories</option>
            <option value="ASUS">ASUS</option>
            <option value="MSI">MSI</option>
            <option value="Gigabyte">Gigabyte</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Particles.js Library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Initialize Particles
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ff1a1a" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": false, "anim": { "enable": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#8b0000", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });

        let allProducts = []; // Store all products for filtering

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        // Determine Category from Name
        function getCategory(name) {
            const n = name.toUpperCase();
            if (n.includes('ASUS')) return 'ASUS';
            if (n.includes('MSI')) return 'MSI';
            if (n.includes('GIGABYTE')) return 'Gigabyte';
            return 'Other';
        }

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1/-1;">Loading products...</p>';
            
            try {
                const response = await fetch('/api/index?action=get-products');
                const data = await response.json();
                
                if (!response.ok || !data.products || data.products.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1/-1;">No products available currently.</p>';
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    return;
                }

                allProducts = data.products;
                renderProducts(allProducts);
                document.getElementById('loadingOverlay').classList.add('hidden');
            } catch (error) {
                grid.innerHTML = '<p style="text-align:center; color:#ff0000; grid-column: 1/-1;">Failed to load products.</p>';
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1/-1;">No products match your search.</p>';
                return;
            }

            products.forEach(product => {
                const isSoldOut = product.isSoldOut || false; // Check if sold out
                const statusClass = isSoldOut ? 'status-sold' : 'status-available';
                const statusText = isSoldOut ? 'SOLD OUT' : 'AVAILABLE';
                const category = product.category || getCategory(product.name);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="status-badge ${statusClass}">${statusText}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-desc">${product.description || 'No description available.'}</div>
                    <div class="code-section">
                        ${isSoldOut ? 
                            `<p style="text-align:center; color:#ff0000; font-family:'Orbitron'; font-size:0.9rem;">Out of Stock</p>` : 
                            `<div class="input-group">
                                <input type="text" id="input-${product.id}" placeholder="Enter code..." maxlength="20" ${isSoldOut ? 'disabled' : ''}>
                                <button onclick="unlockProduct('${product.id}')" id="btn-${product.id}" ${isSoldOut ? 'disabled' : ''}>Unlock</button>
                            </div>
                            <a href="#" class="download-btn" id="dl-${product.id}" download>Download File</a>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = allProducts.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) || 
                                     (product.description && product.description.toLowerCase().includes(searchTerm));
                const productCategory = product.category || getCategory(product.name);
                const matchesCategory = category === 'all' || productCategory === category;
                return matchesSearch && matchesCategory;
            });

            renderProducts(filtered);
        }

        async function unlockProduct(id) {
            const input = document.getElementById(`input-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const dlBtn = document.getElementById(`dl-${id}`);
            const code = input.value.trim();

            if (!code) { showToast('Please enter a code.', 'error'); return; }

            btn.innerText = '...';
            btn.disabled = true;
            dlBtn.style.display = 'none';

            try {
                const response = await fetch(`/api/index?action=unlock&productId=${id}&code=${code}`);
                const data = await response.json();

                if (response.ok && data.success) {
                    showToast('Code accepted! File unlocked.', 'success');
                    dlBtn.href = data.fileUrl;
                    dlBtn.style.display = 'block';
                } else {
                    showToast(data.error || 'Invalid code.', 'error');
                }
            } catch (error) {
                showToast('Network error.', 'error');
            } finally {
                btn.innerText = 'Unlock';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
