<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouble Makers - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0a0a0a; --primary-red: #ff1a1a; --dark-red: #8b0000; --text-color: #e0e0e0; --card-bg: rgba(20, 20, 20, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #1a0000 0%, #0a0a0a 70%);
            color: var(--text-color); font-family: 'Rajdhani', sans-serif; min-height: 100vh;
        }
        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--card-bg); border: 1px solid var(--dark-red); padding: 40px; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 26, 26, 0.2); text-align: center; width: 100%; max-width: 400px; animation: fadeIn 0.5s ease; }
        .login-box h2 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-red); }

        #dashboard { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .header h1 { font-family: 'Orbitron', sans-serif; color: white; text-shadow: 0 0 10px var(--primary-red); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; color: #aaa; font-size: 0.9rem; }
        input[type="text"], input[type="password"], textarea {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white;
            font-family: 'Rajdhani', sans-serif; font-size: 1rem; border-radius: 5px; outline: none; resize: vertical;
        }
        input:focus, textarea:focus { border-color: var(--primary-red); }
        input[type="file"] {
            width: 100%; padding: 10px; background: #000; border: 1px dashed #333; color: #aaa;
            border-radius: 5px; cursor: pointer;
        }
        
        button {
            width: 100%; padding: 15px; background: var(--dark-red); color: white; border: none;
            font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: bold; cursor: pointer;
            border-radius: 5px; transition: all 0.3s ease; text-transform: uppercase;
        }
        button:hover { background: var(--primary-red); box-shadow: 0 0 20px var(--primary-red); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .panel { background: var(--card-bg); border: 1px solid #222; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .panel h2 { font-family: 'Orbitron', sans-serif; color: white; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .product-list { display: flex; flex-direction: column; gap: 15px; max-height: 600px; overflow-y: auto; padding-right: 10px; }
        .product-item { background: #111; border: 1px solid #222; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        .product-item:hover { border-color: var(--dark-red); }
        .product-info h3 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin-bottom: 5px; font-size: 1.1rem; }
        .product-info p { color: #888; font-size: 0.9rem; }
        .code-badge { background: #000; border: 1px solid #333; padding: 8px 12px; border-radius: 5px; font-family: 'Orbitron', sans-serif; color: #00ff00; letter-spacing: 2px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; }
        .code-badge:hover { border-color: #00ff00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
        
        .divider { border-top: 1px solid #333; margin: 25px 0; }
        
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #111; color: white;
            padding: 15px 25px; border-left: 4px solid var(--primary-red); border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); transform: translateX(150%); transition: transform 0.4s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #ff0000; }
        .toast.success { border-left-color: #00ff00; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2>RESTRICTED ACCESS</h2>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Enter Admin Password">
            </div>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>TROUBLE MAKERS ADMIN</h1>
            <button onclick="logout()" style="width: auto; padding: 10px 20px; font-size: 0.8rem; background: transparent; border: 1px solid var(--primary-red); color: var(--primary-red);">Logout</button>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <h2>Add New Product</h2>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodName" placeholder="e.g., ASUS ROG BIOS">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDesc" rows="3" placeholder="Short description..."></textarea>
                </div>
                
                <div class="form-group" style="border: 1px solid #333; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                    <label>File Source (Choose One)</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <label style="color: #fff; font-size: 0.9rem;"><input type="radio" name="fileSource" value="url" checked onchange="toggleSource()"> Link</label>
                        <label style="color: #fff; font-size: 0.9rem;"><input type="radio" name="fileSource" value="upload" onchange="toggleSource()"> Upload File</label>
                    </div>
                    <div id="urlInputGroup">
                        <input type="text" id="prodUrl" placeholder="https://example.com/file.bin">
                    </div>
                    <div id="uploadInputGroup" style="display: none;">
                        <input type="file" id="prodFile">
                    </div>
                </div>

                <button onclick="addProduct()" id="addBtn">Generate Code & Add Product</button>
                
                <div class="divider"></div>
                <h2 style="font-size: 1.2rem;">Change Password</h2>
                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="New Password">
                </div>
                <button onclick="changePassword()" id="passBtn" style="background: #333;">Update Password</button>
            </div>

            <div class="panel">
                <h2>All Products & Codes</h2>
                <div class="product-list" id="productList"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentPassword = '';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function toggleSource() {
            const source = document.querySelector('input[name="fileSource"]:checked').value;
            document.getElementById('urlInputGroup').style.display = source === 'url' ? 'block' : 'none';
            document.getElementById('uploadInputGroup').style.display = source === 'upload' ? 'block' : 'none';
        }

        async function login() {
            const pass = document.getElementById('passwordInput').value;
            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', adminPassword: pass })
                });
                if (response.ok) {
                    currentPassword = pass;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadProducts();
                } else {
                    showToast('Wrong password!', 'error');
                }
            } catch (e) { showToast('Network Error', 'error'); }
        }

        function logout() { location.reload(); }

        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const desc = document.getElementById('prodDesc').value;
            const source = document.querySelector('input[name="fileSource"]:checked').value;
            const btn = document.getElementById('addBtn');

            if (!name) { showToast('Product Name is required.', 'error'); return; }

            let fileUrl = '';
            let fileData = null;
            let fileName = '';

            if (source === 'url') {
                fileUrl = document.getElementById('prodUrl').value;
                if (!fileUrl) { showToast('File URL is required.', 'error'); return; }
            } else {
                const fileInput = document.getElementById('prodFile');
                if (fileInput.files.length === 0) { showToast('Please select a file.', 'error'); return; }
                const file = fileInput.files[0];
                fileName = file.name;
                
                // Convert to Base64
                const reader = new FileReader();
                const base64Promise = new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
                fileData = await base64Promise;
            }

            btn.innerText = 'Processing...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'add-product',
                        adminPassword: currentPassword,
                        name: name,
                        description: desc,
                        fileUrl: fileUrl,
                        fileData: fileData,
                        fileName: fileName
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast('Product added! Code: ' + data.code, 'success');
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodDesc').value = '';
                    document.getElementById('prodUrl').value = '';
                    document.getElementById('prodFile').value = '';
                    loadProducts();
                } else {
                    showToast(data.error || 'Failed to add product.', 'error');
                }
            } catch (error) { showToast('Network Error', 'error'); }
            finally { btn.innerText = 'Generate Code & Add Product'; btn.disabled = false; }
        }

        async function loadProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '<p style="color:#888;">Loading...</p>';
            
            try {
                const response = await fetch('/api/index?action=get-products');
                const data = await response.json();
                
                if (!response.ok || !data.products) {
                    list.innerHTML = '<p style="color:#888;">No products found.</p>';
                    return;
                }

                list.innerHTML = '';
                data.products.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.description || 'No description'}</p>
                        </div>
                        <div class="code-badge" onclick="copyCode('${product.code}')" title="Click to copy">
                            ${product.code}
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (error) { list.innerHTML = '<p style="color:#ff0000;">Error loading products.</p>'; }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            showToast('Code copied: ' + code, 'success');
        }

        async function changePassword() {
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('passBtn');
            if (!newPass) { showToast('Enter new password.', 'error'); return; }

            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change-password',
                        adminPassword: currentPassword,
                        newPassword: newPass
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    currentPassword = newPass;
                    showToast('Password updated successfully!', 'success');
                    document.getElementById('newPassword').value = '';
                } else {
                    showToast(data.error || 'Failed to update password.', 'error');
                }
            } catch (error) { showToast('Network Error', 'error'); }
            finally { btn.innerText = 'Update Password'; btn.disabled = false; }
        }
    </script>
</body>
</html>
