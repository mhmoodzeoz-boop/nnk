<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouble Makers - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0a0a0a; --primary-red: #ff1a1a; --dark-red: #8b0000; --text-color: #e0e0e0; --card-bg: rgba(20, 20, 20, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #1a0000 0%, #0a0a0a 70%);
            color: var(--text-color); font-family: 'Rajdhani', sans-serif; min-height: 100vh;
        }
        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--card-bg); border: 1px solid var(--dark-red); padding: 40px; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 26, 26, 0.2); text-align: center; width: 100%; max-width: 400px; animation: fadeIn 0.5s ease; }
        .login-box h2 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-red); }

        #dashboard { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .header h1 { font-family: 'Orbitron', sans-serif; color: white; text-shadow: 0 0 10px var(--primary-red); }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid #222; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: #888; font-size: 0.9rem; margin-bottom: 10px; }
        .stat-card .number { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--primary-red); text-shadow: 0 0 10px rgba(255,26,26,0.5); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; color: #aaa; font-size: 0.9rem; }
        input[type="text"], input[type="password"], textarea {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white;
            font-family: 'Rajdhani', sans-serif; font-size: 1rem; border-radius: 5px; outline: none; resize: vertical;
        }
        input:focus, textarea:focus { border-color: var(--primary-red); }
        
        button {
            width: 100%; padding: 15px; background: var(--dark-red); color: white; border: none;
            font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: bold; cursor: pointer;
            border-radius: 5px; transition: all 0.3s ease; text-transform: uppercase;
        }
        button:hover { background: var(--primary-red); box-shadow: 0 0 20px var(--primary-red); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 30px; }
        .panel { background: var(--card-bg); border: 1px solid #222; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .panel h2 { font-family: 'Orbitron', sans-serif; color: white; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        /* Product List */
        .product-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .product-item { background: #111; border: 1px solid #222; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; transition: all 0.3s ease; }
        .product-item:hover { border-color: var(--dark-red); }
        .product-item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .product-info h3 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin-bottom: 5px; font-size: 1rem; }
        .product-info p { color: #888; font-size: 0.85rem; }
        .code-badge { background: #000; border: 1px solid #333; padding: 5px 10px; border-radius: 5px; font-family: 'Orbitron', sans-serif; color: #00ff00; letter-spacing: 1px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .code-badge:hover { border-color: #00ff00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
        
        .actions { display: flex; gap: 5px; margin-top: 5px; }
        .actions button { padding: 5px 10px; font-size: 0.8rem; width: auto; flex: 1; }
        .btn-edit { background: #333; }
        .btn-delete { background: #500; }
        .btn-toggle { background: #005; }

        /* Activity Log */
        .activity-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; }
        .activity-item { font-size: 0.85rem; padding: 8px; border-left: 2px solid #333; background: rgba(0,0,0,0.3); }
        .activity-item span.time { color: #666; font-size: 0.75rem; display: block; margin-bottom: 3px; }
        .activity-item span.desc { color: #ccc; }

        .divider { border-top: 1px solid #333; margin: 25px 0; }
        
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #111; color: white;
            padding: 15px 25px; border-left: 4px solid var(--primary-red); border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); transform: translateX(150%); transition: transform 0.4s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #ff0000; }
        .toast.success { border-left-color: #00ff00; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2>RESTRICTED ACCESS</h2>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Enter Admin Password">
            </div>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>TROUBLE MAKERS ADMIN</h1>
            <button onclick="logout()" style="width: auto; padding: 10px 20px; font-size: 0.8rem; background: transparent; border: 1px solid var(--primary-red); color: var(--primary-red);">Logout</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <div class="number" id="statTotalProducts">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Unlocks</h3>
                <div class="number" id="statTotalUnlocks">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Codes</h3>
                <div class="number" id="statActiveCodes">0</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Add Product Form -->
            <div class="panel">
                <h2>Add New Product</h2>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodName" placeholder="e.g., ASUS ROG BIOS">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDesc" rows="2" placeholder="Short description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="prodCategory" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:white; border-radius:5px; font-family:'Rajdhani';">
                        <option value="ASUS">ASUS</option>
                        <option value="MSI">MSI</option>
                        <option value="Gigabyte">Gigabyte</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group" style="border: 1px solid #333; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    <label>File Source</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                        <label style="color: #fff; font-size: 0.85rem;"><input type="radio" name="fileSource" value="url" checked onchange="toggleSource()"> Link</label>
                        <label style="color: #fff; font-size: 0.85rem;"><input type="radio" name="fileSource" value="upload" onchange="toggleSource()"> Upload</label>
                    </div>
                    <div id="urlInputGroup">
                        <input type="text" id="prodUrl" placeholder="https://example.com/file.bin">
                    </div>
                    <div id="uploadInputGroup" style="display: none;">
                        <input type="file" id="prodFile" style="width:100%; padding:8px; background:#000; border:1px dashed #333; color:#aaa; border-radius:5px;">
                    </div>
                </div>

                <button onclick="addProduct()" id="addBtn">Add Product</button>
                
                <div class="divider"></div>
                <h2 style="font-size: 1rem;">Change Password</h2>
                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="New Password">
                </div>
                <button onclick="changePassword()" id="passBtn" style="background: #333;">Update Password</button>
            </div>

            <!-- Products List -->
            <div class="panel">
                <h2>Products Management</h2>
                <div class="product-list" id="productList"></div>
            </div>

            <!-- Activity Log -->
            <div class="panel">
                <h2>Activity Log</h2>
                <div class="activity-list" id="activityList"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentPassword = '';
        let editingProductId = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function toggleSource() {
            const source = document.querySelector('input[name="fileSource"]:checked').value;
            document.getElementById('urlInputGroup').style.display = source === 'url' ? 'block' : 'none';
            document.getElementById('uploadInputGroup').style.display = source === 'upload' ? 'block' : 'none';
        }

        async function login() {
            const pass = document.getElementById('passwordInput').value;
            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', adminPassword: pass })
                });
                if (response.ok) {
                    currentPassword = pass;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadDashboard();
                } else {
                    showToast('Wrong password!', 'error');
                }
            } catch (e) { showToast('Network Error', 'error'); }
        }

        function logout() { location.reload(); }

        async function loadDashboard() {
            loadProducts();
            loadStats();
            loadActivityLog();
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/index?action=get-stats');
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('statTotalProducts').innerText = data.totalProducts;
                    document.getElementById('statTotalUnlocks').innerText = data.totalUnlocks;
                    document.getElementById('statActiveCodes').innerText = data.activeCodes;
                }
            } catch (error) { console.error('Failed to load stats'); }
        }

        async function loadActivityLog() {
            const list = document.getElementById('activityList');
            try {
                const response = await fetch('/api/index?action=get-activity');
                const data = await response.json();
                
                if (response.ok && data.logs) {
                    list.innerHTML = '';
                    data.logs.forEach(log => {
                        const item = document.createElement('div');
                        item.className = 'activity-item';
                        const date = new Date(log.timestamp).toLocaleString();
                        item.innerHTML = `<span class="time">${date}</span><span class="desc">${log.description}</span>`;
                        list.appendChild(item);
                    });
                } else {
                    list.innerHTML = '<p style="color:#666; font-size:0.85rem;">No activity yet.</p>';
                }
            } catch (error) { list.innerHTML = '<p style="color:#ff0000; font-size:0.85rem;">Error loading logs.</p>'; }
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const desc = document.getElementById('prodDesc').value;
            const category = document.getElementById('prodCategory').value;
            const source = document.querySelector('input[name="fileSource"]:checked').value;
            const btn = document.getElementById('addBtn');

            if (!name) { showToast('Product Name is required.', 'error'); return; }

            let fileUrl = '';
            let fileData = null;
            let fileName = '';

            if (source === 'url') {
                fileUrl = document.getElementById('prodUrl').value;
                if (!fileUrl) { showToast('File URL is required.', 'error'); return; }
            } else {
                const fileInput = document.getElementById('prodFile');
                if (fileInput.files.length === 0) { showToast('Please select a file.', 'error'); return; }
                const file = fileInput.files[0];
                fileName = file.name;
                const reader = new FileReader();
                const base64Promise = new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
                fileData = await base64Promise;
            }

            btn.innerText = 'Processing...';
            btn.disabled = true;

            try {
                const action = editingProductId ? 'edit-product' : 'add-product';
                const payload = {
                    action: action,
                    adminPassword: currentPassword,
                    name: name,
                    description: desc,
                    category: category,
                    fileUrl: fileUrl,
                    fileData: fileData,
                    fileName: fileName
                };
                if (editingProductId) payload.productId = editingProductId;

                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(editingProductId ? 'Product updated!' : `Product added! Code: ${data.code}`, 'success');
                    resetForm();
                    loadDashboard();
                } else {
                    showToast(data.error || 'Failed to save product.', 'error');
                }
            } catch (error) { showToast('Network Error', 'error'); }
            finally { btn.innerText = 'Add Product'; btn.disabled = false; }
        }

        function resetForm() {
            editingProductId = null;
            document.getElementById('prodName').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodUrl').value = '';
            document.getElementById('prodFile').value = '';
            document.getElementById('addBtn').innerText = 'Add Product';
        }

        async function loadProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '<p style="color:#888;">Loading...</p>';
            
            try {
                const response = await fetch('/api/index?action=get-products');
                const data = await response.json();
                
                if (!response.ok || !data.products) {
                    list.innerHTML = '<p style="color:#888;">No products found.</p>';
                    return;
                }

                list.innerHTML = '';
                data.products.forEach(product => {
                    const isSold = product.isSoldOut || false;
                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <div class="product-item-header">
                            <div class="product-info">
                                <h3>${product.name}</h3>
                                <p>${product.description || 'No description'} | ${product.category || 'Other'}</p>
                            </div>
                            <div class="code-badge" onclick="copyCode('${product.code}')" title="Click to copy">
                                ${product.code}
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-toggle" onclick="toggleStatus('${product.id}', ${isSold})">${isSold ? 'Mark Available' : 'Mark Sold'}</button>
                            <button class="btn-edit" onclick="editProduct('${product.id}')">Edit</button>
                            <button class="btn-delete" onclick="deleteProduct('${product.id}')">Delete</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (error) { list.innerHTML = '<p style="color:#ff0000;">Error loading products.</p>'; }
        }

        function editProduct(id) {
            // Fetch product details to populate form (simplified: find in DOM or refetch)
            fetch('/api/index?action=get-products').then(res => res.json()).then(data => {
                const product = data.products.find(p => p.id === id);
                if (product) {
                    editingProductId = id;
                    document.getElementById('prodName').value = product.name;
                    document.getElementById('prodDesc').value = product.description || '';
                    document.getElementById('prodCategory').value = product.category || 'Other';
                    document.getElementById('prodUrl').value = product.fileUrl;
                    document.getElementById('addBtn').innerText = 'Update Product';
                    // Scroll to top of form
                    document.querySelector('.panel').scrollIntoView({ behavior: 'smooth' });
                }
            });
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete-product',
                        adminPassword: currentPassword,
                        productId: id
                    })
                });
                if (response.ok) { showToast('Product deleted.', 'success'); loadDashboard(); }
                else { showToast('Failed to delete.', 'error'); }
            } catch (error) { showToast('Network Error', 'error'); }
        }

        async function toggleStatus(id, currentStatus) {
            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'toggle-status',
                        adminPassword: currentPassword,
                        productId: id,
                        isSoldOut: !currentStatus
                    })
                });
                if (response.ok) { showToast('Status updated.', 'success'); loadDashboard(); }
                else { showToast('Failed to update status.', 'error'); }
            } catch (error) { showToast('Network Error', 'error'); }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            showToast('Code copied: ' + code, 'success');
        }

        async function changePassword() {
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('passBtn');
            if (!newPass) { showToast('Enter new password.', 'error'); return; }

            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change-password',
                        adminPassword: currentPassword,
                        newPassword: newPass
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    currentPassword = newPass;
                    showToast('Password updated successfully!', 'success');
                    document.getElementById('newPassword').value = '';
                } else {
                    showToast(data.error || 'Failed to update password.', 'error');
                }
            } catch (error) { showToast('Network Error', 'error'); }
            finally { btn.innerText = 'Update Password'; btn.disabled = false; }
        }
    </script>
</body>
</html>
