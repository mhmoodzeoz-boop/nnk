<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0a0a0a; --primary-red: #ff1a1a; --dark-red: #8b0000; --text-color: #e0e0e0; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a0000 0%, #0a0a0a 70%);
            color: var(--text-color); font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }
        #loginScreen {
            background: rgba(20, 20, 20, 0.9); border: 1px solid var(--dark-red);
            padding: 40px; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 26, 26, 0.2);
            text-align: center; width: 100%; max-width: 400px; animation: fadeIn 0.5s ease;
        }
        #loginScreen h2 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-red); }
        #adminPanel {
            display: none; background: rgba(20, 20, 20, 0.9); border: 1px solid var(--dark-red);
            padding: 40px; border-radius: 10px; box-shadow: 0 0 30px rgba(255, 26, 26, 0.2);
            width: 100%; max-width: 600px; margin: 20px; animation: fadeIn 0.5s ease;
        }
        #adminPanel h1 { font-family: 'Orbitron', sans-serif; color: white; text-shadow: 0 0 10px var(--primary-red); text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #aaa; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            color: white; font-family: 'Rajdhani', sans-serif; font-size: 1rem;
            border-radius: 5px; outline: none;
        }
        input:focus { border-color: var(--primary-red); }
        button {
            width: 100%; padding: 15px; background: var(--dark-red); color: white;
            border: none; font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: bold;
            cursor: pointer; border-radius: 5px; transition: all 0.3s ease; text-transform: uppercase;
        }
        button:hover { background: var(--primary-red); box-shadow: 0 0 20px var(--primary-red); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .divider { border-top: 1px solid #333; margin: 30px 0; }
        .code-result {
            margin-top: 30px; padding: 20px; background: #000; border: 1px solid var(--primary-red);
            border-radius: 5px; text-align: center; display: none;
        }
        .code-result h2 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); margin: 0 0 15px 0; font-size: 2.5rem; letter-spacing: 8px; text-shadow: 0 0 15px var(--primary-red); }
        .code-result p { margin: 5px 0; color: #aaa; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <h2>RESTRICTED ACCESS</h2>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="Enter Admin Password">
        </div>
        <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel">
        <h1>ADMIN CONTROL</h1>
        <div class="form-group">
            <label>File Name (e.g., ASUS_B550_BIOS.bin)</label>
            <input type="text" id="fileName" placeholder="Enter file name">
        </div>
        <div class="form-group">
            <label>Download Link (URL)</label>
            <input type="text" id="fileUrl" placeholder="https://example.com/file.bin">
        </div>
        <button onclick="addFile()" id="submitBtn">Generate Code & Save</button>
        <div class="code-result" id="codeResult">
            <h2 id="generatedCode">XXXXXX</h2>
            <p>Give this code to the customer.</p>
            <p>File: <span id="resultFileName"></span></p>
        </div>

        <div class="divider"></div>
        <h2 style="font-family: 'Orbitron', sans-serif; color: var(--primary-red); text-align: center; margin-bottom: 20px;">CHANGE PASSWORD</h2>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
        <button onclick="changePassword()" id="changePassBtn">Update Password</button>
        <div id="passResult" style="text-align: center; margin-top: 15px; color: #00ff00; display: none;">Password Updated Successfully!</div>
    </div>

    <script>
        let currentPassword = '';

        function login() {
            const pass = document.getElementById('passwordInput').value;
            // تحقق مبدئي في المتصفح (التحقق الحقيقي في السيرفر)
            if (pass === 'mklopmklop') { // الباسورد الافتراضي
                currentPassword = pass;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('Wrong password!');
            }
        }

        async function addFile() {
            const fileName = document.getElementById('fileName').value;
            const fileUrl = document.getElementById('fileUrl').value;
            const submitBtn = document.getElementById('submitBtn');
            const codeResult = document.getElementById('codeResult');

            if (!fileName || !fileUrl) { alert('Please fill all fields.'); return; }

            submitBtn.innerText = 'Processing...';
            submitBtn.disabled = true;
            codeResult.style.display = 'none';

            try {
                const response = await fetch('/api/add-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminPassword: currentPassword,
                        fileName: fileName,
                        fileUrl: fileUrl
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('generatedCode').innerText = data.code;
                    document.getElementById('resultFileName').innerText = fileName;
                    codeResult.style.display = 'block';
                    document.getElementById('fileName').value = '';
                    document.getElementById('fileUrl').value = '';
                } else {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                }
            } catch (error) { alert('Network Error'); }
            finally { submitBtn.innerText = 'Generate Code & Save'; submitBtn.disabled = false; }
        }

        async function changePassword() {
            const newPass = document.getElementById('newPassword').value;
            const changePassBtn = document.getElementById('changePassBtn');
            const passResult = document.getElementById('passResult');

            if (!newPass) { alert('Enter new password.'); return; }

            changePassBtn.innerText = 'Updating...';
            changePassBtn.disabled = true;
            passResult.style.display = 'none';

            try {
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminPassword: currentPassword,
                        newPassword: newPass
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    currentPassword = newPass;
                    passResult.style.display = 'block';
                    document.getElementById('newPassword').value = '';
                } else {
                    alert('Error: ' + (data.error || 'Failed to change password'));
                }
            } catch (error) { alert('Network Error'); }
            finally { changePassBtn.innerText = 'Update Password'; changePassBtn.disabled = false; }
        }
    </script>
</body>
</html>
